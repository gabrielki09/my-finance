services:
  frontend:
    build:
      context: ./app
      dockerfile: ../app/docker/dockerfile.dev
    container_name: amodrinks_app
    ports:
      - "9090:9090"
    volumes:
      - ./app:/app
      - /app/node_modules
    env_file:
      - ./app/.env
    environment:
      CHOKIDAR_USEPOLLING: "true"

  backend:
    build: 
      context: ./api
      dockerfile: ../api/docker/dockerfile.dev
    container_name: amodrinks_api
    ports:
      - "8000:8000"
    volumes:
      - ./api:/app
    env_file:
      - ./api/.env

  postgres:
    image: postgres:18-alpine
    container_name: amodrinks_postgres
    restart: always
    environment:
      POSTGRES_DB: amo_drinks
      POSTGRES_USER: amodrinks
      POSTGRES_PASSWORD: masterkey
    ports:
      - "5433:5432"
    volumes:
      - amodrinks_postgres_data:/var/lib/postgresql

volumes:
  amodrinks_postgres_data: