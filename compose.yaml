services:
  frontend:
    build:
      context: ./app
      dockerfile: dockerfile.dev
    container_name: finance_frontend
    restart: unless-stopped
    ports:
      - "9000:9000"
    volumes:
      - ./app:/app
      - finance_frontend_node_modules:/app/node_modules
    env_file:
      - ./app/.env
    environment:
      CHOKIDAR_USEPOLLING: "true"
    depends_on:
      - backend

  backend:
    build: 
      context: ./api
      dockerfile: ./dockerfile.dev
    container_name: finance_api
    restart: unless-stopped
    ports:
      - "3000:3000"
    volumes:
      - ./api:/app
    env_file:
      - ./api/.env

  postgres:
    image: postgres:18-alpine
    container_name: finance_postgres
    restart: always
    environment:
      POSTGRES_DB: finance_db
      POSTGRES_USER: finance
      POSTGRES_PASSWORD: masterkey
    ports:
      - "5544:5432"
    volumes:
      - finance_postgres_data:/var/lib/postgresql
    healthcheck:
        test: ["CMD-SHELL", "pg_isready -U finance -d finance_db"]
        interval: 5s
        timeout: 5s
        retries: 10

volumes:
  finance_postgres_data:
  finance_frontend_node_modules: